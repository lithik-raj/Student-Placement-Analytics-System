<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

```
<style>
    body {
        margin: 0;
        padding: 0;
        background: #050816;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .login-box {
        width: 380px;
        padding: 30px;
        background: #0a1228;
        border: 1px solid #00e5ff;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
    }

    h1 {
        text-align: center;
        color: #00e5ff;
    }

    .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-bottom: 18px;
        background: #080f24;
        color: white;
        border: 1px solid #31506b;
        border-radius: 8px;
        font-size: 15px;
    }

    .password-box {
        position: relative;
    }

    .password-box input {
        padding-right: 70px;
    }

    .show-button {
        position: absolute;
        right: 8px;
        top: 9px;
        background: none;
        border: none;
        color: #00e5ff;
        font-weight: bold;
        cursor: pointer;
    }

    .login-button {
        width: 100%;
        padding: 13px;
        background: rgba(0, 229, 255, 0.12);
        color: #00e5ff;
        border: 1px solid #00e5ff;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-button:hover {
        background: rgba(0, 229, 255, 0.25);
    }

    .error {
        padding: 10px;
        margin-bottom: 15px;
        background: rgba(255, 50, 80, 0.15);
        color: #ff6b81;
        border-radius: 8px;
        text-align: center;
    }

    .back {
        display: block;
        margin-top: 20px;
        text-align: center;
        color: #999;
        text-decoration: none;
    }
</style>
```

</head>

<body>

```
<div class="login-box">

    <h1>Admin Login</h1>

    <div class="subtitle">
        Placement Analytics System
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <label for="username">Login ID</label>

        <input
            type="email"
            id="username"
            name="username"
            placeholder="Enter login ID"
            required
        >

        <label for="password">Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button
                type="button"
                class="show-button"
                onclick="togglePassword()">
                Show
            </button>

        </div>

        <button type="submit" class="login-button">
            Login
        </button>

    </form>

    <a href="{{ url_for('home') }}" class="back">
        Back to Dashboard
    </a>

</div>

<script>
    function togglePassword() {
        var password = document.getElementById("password");
        var button = document.querySelector(".show-button");

        if (password.type === "password") {
            password.type = "text";
            button.innerHTML = "Hide";
        } else {
            password.type = "password";
            button.innerHTML = "Show";
        }
    }
</script>
```

</body>
</html>
